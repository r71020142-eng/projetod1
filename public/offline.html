<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Método Paulo • Modo Offline</title>
  <meta name="theme-color" content="#0F172A" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0F172A;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .logo-container {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0826;
      border-radius: 16px;
      border: 1px solid rgba(215, 154, 36, 0.3);
    }
    .logo-container img {
      width: 40px;
      height: 40px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(135deg, #5B2FE8 0%, #7047F5 100%);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 4px 12px rgba(91, 47, 232, 0.35);
    }
    .btn-retry:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .badge {
      display: inline-block;
      margin-top: 16px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #D79A24;
      background: rgba(215, 154, 36, 0.12);
      padding: 4px 10px;
      border-radius: 9999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img src="/assets/mtd/mtd-logo-mark.svg" alt="Método Paulo" />
    </div>
    <h1>Sem conexão com a internet</h1>
    <p>
      O Método Paulo é uma plataforma conectada em tempo real com aulas, materiais e interações pedagógicas sincronizadas. Conecte-se à internet para continuar seus estudos.
    </p>
    <button class="btn-retry" onclick="window.location.reload()">
      Tentar reconectar
    </button>
    <div>
      <span class="badge">Método Paulo • Language Academy</span>
    </div>
  </div>
</body>
</html>
